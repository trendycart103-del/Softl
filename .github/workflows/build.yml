name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d /tmp/unz
          ROOT=$(dirname "$(find /tmp/unz -name settings.gradle | head -n 1)")
          cp -r "$ROOT"/. .
          rm -f "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BubblePlayer-apk
          path: app/build/outputs/apk/debug/*.apk
